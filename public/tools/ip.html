<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP 查询 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">IP 查询</div>
        <div class="topbar-actions"><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="card">
          <div class="card-header"><span class="card-title">本机 IP</span><button class="btn btn-sm" onclick="getIP()">🔄 刷新</button></div>
          <div id="ipResult" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px"></div>
        </div>
        <div class="divider"></div>
        <div class="card">
          <div class="card-header"><span class="card-title">查询其他 IP</span></div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <input class="input" id="queryIP" placeholder="输入 IP 地址">
            <button class="btn btn-primary" onclick="queryIP()">🔍 查询</button>
          </div>
          <div id="queryResult"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('ip','IP 查询','net');
    async function getIP(){
      const container=document.getElementById('ipResult');
      container.innerHTML='<div class="empty-state">查询中...</div>';
      try{
        const res=await fetch('https://api.ipify.org?format=json');
        const data=await res.json();
        container.innerHTML=`<div class="card" style="padding:12px 16px"><div style="font-size:11px;color:var(--text-muted)">公网 IPv4</div><div style="font-family:var(--font-mono);font-size:18px;margin-top:4px">${data.ip}</div></div>`;
      }catch(e){container.innerHTML='<div class="empty-state">查询失败</div>';}
    }
    async function queryIP(){
      const ip=document.getElementById('queryIP').value.trim();
      if(!ip){showToast('请输入 IP');return;}
      const container=document.getElementById('queryResult');
      container.innerHTML='<div class="empty-state">查询中...</div>';
      try{
        const res=await fetch(`https://ipapi.co/${ip}/json/`);
        const data=await res.json();
        container.innerHTML=`<div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">${Object.entries(data).filter(([k,v])=>v&&typeof v!=='object').map(([k,v])=>`<div><div style="font-size:11px;color:var(--text-muted)">${k}</div><div style="font-family:var(--font-mono);font-size:13px;margin-top:2px">${v}</div></div>`).join('')}</div></div>`;
        logToolUsage('ip','query');
      }catch(e){container.innerHTML='<div class="empty-state">查询失败</div>';}
    }
    getIP();
  </script>
</body>
</html>
