<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色转换 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">颜色转换</div>
        <div class="topbar-actions"><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="card">
          <div class="card-header"><span class="card-title">颜色预览</span></div>
          <div id="preview" style="height:80px;border-radius:8px;border:1px solid var(--border);margin-bottom:16px;background:#58a6ff"></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">HEX</div><input class="input" id="hex" value="#58a6ff" oninput="fromHex()"></div>
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">RGB</div><input class="input" id="rgb" value="rgb(88, 166, 255)" oninput="fromRGB()"></div>
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">HSL</div><input class="input" id="hsl" value="hsl(212, 100%, 67%)" oninput="fromHSL()"></div>
          </div>
          <div class="btn-group" style="margin-top:12px">
            <button class="btn" onclick="randomColor()">🎲 随机</button>
            <button class="btn" onclick="copyToClipboard(document.getElementById('hex').value)">📋 HEX</button>
            <button class="btn" onclick="copyToClipboard(document.getElementById('rgb').value)">📋 RGB</button>
            <button class="btn" onclick="copyToClipboard(document.getElementById('hsl').value)">📋 HSL</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('color','颜色转换','convert');
    function updatePreview(c){document.getElementById('preview').style.background=c;}
    function hexToRgb(hex){const m=hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);if(!m)return null;return {r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)};}
    function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/2;if(max!==min){const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
    function fromHex(){const v=document.getElementById('hex').value.trim();const rgb=hexToRgb(v);if(!rgb)return;const hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);document.getElementById('rgb').value=`rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;document.getElementById('hsl').value=`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;updatePreview(v);logToolUsage('color','convert');}
    function fromRGB(){const v=document.getElementById('rgb').value;const m=v.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);if(!m)return;const r=parseInt(m[1]),g=parseInt(m[2]),b=parseInt(m[3]);const hex='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');const hsl=rgbToHsl(r,g,b);document.getElementById('hex').value=hex;document.getElementById('hsl').value=`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;updatePreview(hex);}
    function fromHSL(){const v=document.getElementById('hsl').value;const m=v.match(/(\d+)[,\s]+(\d+)%?[,\s]+(\d+)%?/);if(!m)return;const h=parseInt(m[1]),s=parseInt(m[2])/100,l=parseInt(m[3])/100;const c=(1-Math.abs(2*l-1))*s;const x=c*(1-Math.abs((h/60)%2-1));const m1=l-c/2;let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];const rr=Math.round((r+m1)*255),gg=Math.round((g+m1)*255),bb=Math.round((b+m1)*255);const hex='#'+[rr,gg,bb].map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('hex').value=hex;document.getElementById('rgb').value=`rgb(${rr}, ${gg}, ${bb})`;updatePreview(hex);}
    function randomColor(){const hex='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');document.getElementById('hex').value=hex;fromHex();logToolUsage('color','random');}
  </script>
</body>
</html>
