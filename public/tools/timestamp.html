<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳转换 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">时间戳转换</div>
        <div class="topbar-actions">
          <a href="/" class="btn btn-sm">🏠 首页</a>
        </div>
      </header>
      <div class="content-body">
        <div class="card">
          <div class="card-header">
            <span class="card-title">当前时间</span>
            <span class="badge" id="liveClock">--</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Unix 时间戳（秒）</div>
              <input class="input" id="tsSec" readonly>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Unix 时间戳（毫秒）</div>
              <input class="input" id="tsMs" readonly>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">ISO 8601</div>
              <input class="input" id="tsISO" readonly>
            </div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">转换工具</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start">
            <div class="panel">
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">时间戳 → 日期</div>
              <input class="input" id="fromTs" placeholder="输入时间戳（秒或毫秒）">
              <button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="tsToDate()">转换日期</button>
              <input class="input" id="toDateResult" placeholder="结果" readonly style="margin-top:8px">
            </div>
            <div style="display:flex;align-items:center;justify-content:center">
              <div style="font-size:24px;color:var(--text-muted)">⇄</div>
            </div>
            <div class="panel">
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">日期 → 时间戳</div>
              <input class="input" type="datetime-local" id="fromDate">
              <button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="dateToTs()">转换时间戳</button>
              <input class="input" id="toTsResult" placeholder="结果" readonly style="margin-top:8px">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('timestamp', '时间戳转换', 'convert');

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleString('zh-CN');
      document.getElementById('tsSec').value = Math.floor(now.getTime() / 1000);
      document.getElementById('tsMs').value = now.getTime();
      document.getElementById('tsISO').value = now.toISOString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function tsToDate() {
      const v = document.getElementById('fromTs').value.trim();
      if (!v) { showToast('请输入时间戳'); return; }
      let ts = parseInt(v);
      if (v.length <= 10) ts *= 1000;
      const d = new Date(ts);
      if (isNaN(d)) { showToast('无效的时间戳'); return; }
      document.getElementById('toDateResult').value = d.toLocaleString('zh-CN') + ' | ' + d.toISOString();
      logToolUsage('timestamp', 'tsToDate');
    }

    function dateToTs() {
      const v = document.getElementById('fromDate').value;
      if (!v) { showToast('请选择日期'); return; }
      const d = new Date(v);
      if (isNaN(d)) { showToast('无效的日期'); return; }
      document.getElementById('toTsResult').value = '秒: ' + Math.floor(d.getTime()/1000) + ' | 毫秒: ' + d.getTime();
      logToolUsage('timestamp', 'dateToTs');
    }
  </script>
</body>
</html>
