<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间戳转换</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <header>
    <div class="container">
      <a href="../index.html" class="back">← 返回工具箱</a>
      <h1>⏱️ 时间戳转换</h1>
    </div>
  </header>

  <div class="tool-container">
    <div class="tool-box">
      <h3>当前时间</h3>
      <p id="currentTime" style="font-family:monospace;font-size:1.1rem"></p>
    </div>
    <div class="row">
      <div class="tool-box">
        <h3>时间戳 → 日期</h3>
        <input type="text" id="tsInput" placeholder="1746880000000">
        <select id="tsUnit" style="margin-top:8px">
          <option value="ms">毫秒 (ms)</option>
          <option value="s">秒 (s)</option>
        </select>
        <button class="btn" onclick="tsToDate()" style="margin-top:8px">转换</button>
        <div id="tsOutput" class="output-box"></div>
      </div>
      <div class="tool-box">
        <h3>日期 → 时间戳</h3>
        <input type="text" id="dateInput" placeholder="2026-05-10 12:00:00">
        <button class="btn" onclick="dateToTs()" style="margin-top:8px">转换</button>
        <div id="dateOutput" class="output-box"></div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function updateCurrent() {
      const now = new Date();
      document.getElementById('currentTime').innerHTML = 
        `本地: ${now.toLocaleString()}<br>时间戳(ms): ${now.getTime()}<br>时间戳(s): ${Math.floor(now.getTime()/1000)}`;
    }
    updateCurrent();
    setInterval(updateCurrent, 1000);

    function tsToDate() {
      const val = document.getElementById('tsInput').value.trim();
      const unit = document.getElementById('tsUnit').value;
      if (!val) return;
      let ts = parseInt(val);
      if (unit === 's') ts *= 1000;
      const d = new Date(ts);
      document.getElementById('tsOutput').innerHTML = 
        `日期: ${d.toLocaleString()}<br>ISO: ${d.toISOString()}`;
      logTool('timestamp', 'tsToDate');
    }
    function dateToTs() {
      const val = document.getElementById('dateInput').value.trim();
      if (!val) return;
      const d = new Date(val);
      if (isNaN(d.getTime())) {
        document.getElementById('dateOutput').textContent = '❌ 日期格式无效';
        return;
      }
      document.getElementById('dateOutput').innerHTML = 
        `毫秒: ${d.getTime()}<br>秒: ${Math.floor(d.getTime()/1000)}`;
      logTool('timestamp', 'dateToTs');
    }
  </script>
</body>
</html>
