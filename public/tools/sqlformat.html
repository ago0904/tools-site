<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL 格式化 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">SQL 格式化</div>
        <div class="topbar-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="tool-layout">
          <div class="panel">
            <div class="panel-header"><span>输入 SQL</span><div class="panel-actions"><button class="btn btn-sm" onclick="clearAll()">🗑️</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="input" placeholder="粘贴 SQL..."></textarea></div>
          </div>
          <div class="middle-actions">
            <button class="btn btn-primary" onclick="beautifySQL()" title="美化">✨</button>
            <button class="btn btn-sm" onclick="upperSQL()" title="大写">🔠</button>
            <button class="btn btn-sm" onclick="lowerSQL()" title="小写">🔡</button>
          </div>
          <div class="panel">
            <div class="panel-header"><span>输出</span><div class="panel-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="output" placeholder="结果..." readonly></textarea></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('sqlformat','SQL 格式化','format');
    function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';}
    function beautifySQL(){const v=document.getElementById('input').value;if(!v){showToast('请输入 SQL');return;}const keywords=['SELECT','FROM','WHERE','JOIN','LEFT','RIGHT','INNER','OUTER','ON','GROUP','ORDER','BY','HAVING','LIMIT','OFFSET','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','INDEX','UNION','ALL','AND','OR','NOT','NULL','AS','ASC','DESC'];let out=v.replace(/\s+/g,' ').trim();keywords.forEach(k=>{const re=new RegExp('\\b'+k+'\\b','gi');out=out.replace(re,'\n'+k);});out=out.replace(/\n\s*\n/g,'\n').trim();document.getElementById('output').value=out;logToolUsage('sqlformat','beautify');}
    function upperSQL(){const v=document.getElementById('input').value;if(!v)return;document.getElementById('output').value=v.toUpperCase();logToolUsage('sqlformat','upper');}
    function lowerSQL(){const v=document.getElementById('input').value;if(!v)return;document.getElementById('output').value=v.toLowerCase();logToolUsage('sqlformat','lower');}
    function copyOutput(){const o=document.getElementById('output').value;if(o)copyToClipboard(o);else showToast('无内容');}
  </script>
</body>
</html>
