<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV ↔ JSON - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">CSV ↔ JSON</div>
        <div class="topbar-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="tool-layout">
          <div class="panel">
            <div class="panel-header"><span>输入</span><div class="panel-actions"><button class="btn btn-sm" onclick="clearAll()">🗑️</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="input" placeholder="粘贴 CSV 或 JSON...">name,age,city
Alice,30,Beijing
Bob,25,Shanghai</textarea></div>
          </div>
          <div class="middle-actions">
            <button class="btn btn-primary" onclick="csv2json()" title="CSV → JSON">📤</button>
            <button class="btn btn-sm" onclick="json2csv()" title="JSON → CSV">📥</button>
          </div>
          <div class="panel">
            <div class="panel-header"><span>输出</span><div class="panel-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="output" placeholder="结果..." readonly></textarea></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('csv','CSV ↔ JSON','convert');
    function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';}
    function parseCSV(text){const lines=text.trim().split('\n');if(!lines.length)return[];const headers=lines[0].split(',').map(h=>h.trim());return lines.slice(1).map(line=>{const values=[];let val='',inQuotes=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(inQuotes&&line[i+1]==='"'){val+='"';i++;}else{inQuotes=!inQuotes;}}else if(c===','&&!inQuotes){values.push(val.trim());val='';}else{val+=c;}}values.push(val.trim());const obj={};headers.forEach((h,idx)=>obj[h]=values[idx]||'');return obj;});}
    function csv2json(){const v=document.getElementById('input').value.trim();if(!v){showToast('请输入 CSV');return;}try{const data=parseCSV(v);document.getElementById('output').value=JSON.stringify(data,null,2);logToolUsage('csv','csv2json');}catch(e){document.getElementById('output').value='❌ '+e.message;}}
    function json2csv(){const v=document.getElementById('input').value.trim();if(!v){showToast('请输入 JSON');return;}try{const data=JSON.parse(v);if(!Array.isArray(data)||!data.length){showToast('JSON 必须是数组');return;}const keys=Object.keys(data[0]);let csv=keys.join(',')+'\n';data.forEach(row=>{csv+=keys.map(k=>{const val=row[k]??'';if(typeof val==='string'&&(val.includes(',')||val.includes('"'))){return '"'+val.replace(/"/g,'""')+'"';}return val;}).join(',')+'\n';});document.getElementById('output').value=csv.trim();logToolUsage('csv','json2csv');}catch(e){document.getElementById('output').value='❌ '+e.message;}}
    function copyOutput(){const o=document.getElementById('output').value;if(o)copyToClipboard(o);else showToast('无内容');}
  </script>
</body>
</html>
