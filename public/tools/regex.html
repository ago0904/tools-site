<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正则表达式测试</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <header>
    <div class="container">
      <a href="../index.html" class="back">← 返回工具箱</a>
      <h1>🔍 正则表达式测试</h1>
    </div>
  </header>

  <div class="tool-container">
    <div class="tool-box">
      <h3>正则表达式</h3>
      <input type="text" id="pattern" placeholder="[a-z]+" value="[a-z]+">
      <label style="margin-left:8px"><input type="checkbox" id="global" checked> g</label>
      <label><input type="checkbox" id="ignore"> i</label>
      <label><input type="checkbox" id="multiline"> m</label>
    </div>
    <div class="tool-box">
      <h3>测试文本</h3>
      <textarea id="text" placeholder="输入要测试的文本...">Hello World 123</textarea>
      <button class="btn" onclick="testRegex()">测试匹配</button>
      <button class="btn btn-secondary" onclick="replaceRegex()">替换</button>
      <input type="text" id="replaceWith" placeholder="替换为" value="[MATCHED]" style="margin-top:8px">
    </div>
    <div class="tool-box">
      <h3>匹配结果</h3>
      <div id="output" class="output-box"></div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function testRegex() {
      try {
        let flags = '';
        if (document.getElementById('global').checked) flags += 'g';
        if (document.getElementById('ignore').checked) flags += 'i';
        if (document.getElementById('multiline').checked) flags += 'm';
        const re = new RegExp(document.getElementById('pattern').value, flags);
        const text = document.getElementById('text').value;
        const matches = [...text.matchAll(re)];
        if (!matches.length) { document.getElementById('output').textContent = '无匹配'; return; }
        document.getElementById('output').innerHTML = matches.map((m,i) =>
          `匹配 ${i+1}: "${m[0]}" @ 位置 ${m.index}`
        ).join('\n');
        logTool('regex', 'test');
      } catch(e) {
        document.getElementById('output').textContent = '❌ 正则错误: ' + e.message;
      }
    }
    function replaceRegex() {
      try {
        let flags = '';
        if (document.getElementById('global').checked) flags += 'g';
        if (document.getElementById('ignore').checked) flags += 'i';
        if (document.getElementById('multiline').checked) flags += 'm';
        const re = new RegExp(document.getElementById('pattern').value, flags);
        const text = document.getElementById('text').value;
        const rep = document.getElementById('replaceWith').value;
        document.getElementById('output').textContent = text.replace(re, rep);
        logTool('regex', 'replace');
      } catch(e) {
        document.getElementById('output').textContent = '❌ 错误: ' + e.message;
      }
    }
  </script>
</body>
</html>
