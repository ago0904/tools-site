<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假文生成 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">假文生成</div>
        <div class="topbar-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="card">
          <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">段落数</div><input class="input" type="number" id="paragraphs" value="3" min="1" max="20" style="width:100px"></div>
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">语言</div><select class="input" id="lang" style="width:120px"><option value="latin">Lorem Ipsum</option><option value="zh">中文假文</option></select></div>
            <div style="display:flex;align-items:flex-end"><button class="btn btn-primary" onclick="generate()">▶️ 生成</button></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="card">
          <div class="card-header"><span class="card-title">结果</span></div>
          <div id="output" style="font-size:14px;line-height:1.8;color:var(--text-secondary)"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('lorem','假文生成','gen');
    const latin=["Lorem ipsum dolor sit amet, consectetur adipiscing elit.","Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.","Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris."];
    const zh=["这是一段用于填充页面的示例文本，没有任何实际意义。","在设计和开发过程中，经常需要一些占位文字来预览排版效果。","本文本生成器可以帮助开发者快速获取需要的假文内容。"];
    function generate(){
      const n=parseInt(document.getElementById('paragraphs').value)||3;
      const isZh=document.getElementById('lang').value==='zh';
      const pool=isZh?zh:latin;
      let html='';
      for(let i=0;i<n;i++){html+=`<p style="margin-bottom:12px">${pool[i%pool.length]}</p>`;}
      document.getElementById('output').innerHTML=html;
      logToolUsage('lorem','generate');
    }
    function copyOutput(){const o=document.getElementById('output').innerText;if(o)copyToClipboard(o);else showToast('无内容');}
    generate();
  </script>
</body>
</html>
