<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">密码生成</div>
        <div class="topbar-actions"><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="card">
          <div class="card-header"><span class="card-title">配置</span></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px">
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">长度</div><input class="input" type="number" id="len" value="16" min="4" max="128"></div>
            <div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">数量</div><input class="input" type="number" id="count" value="5" min="1" max="50"></div>
          </div>
          <div class="btn-group" style="margin-bottom:16px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="upper" checked> 大写字母</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="lower" checked> 小写字母</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="number" checked> 数字</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="symbol"> 特殊符号</label>
          </div>
          <button class="btn btn-primary" onclick="generate()">▶️ 生成</button>
        </div>
        <div class="divider"></div>
        <div id="results"></div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('password','密码生成','gen');
    function generate(){
      const len=parseInt(document.getElementById('len').value)||16;
      const count=parseInt(document.getElementById('count').value)||5;
      const upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lower='abcdefghijklmnopqrstuvwxyz';
      const num='0123456789';
      const sym='!@#$%^&*()_+-=[]{}|;:,.<>?';
      let chars='';
      if(document.getElementById('upper').checked) chars+=upper;
      if(document.getElementById('lower').checked) chars+=lower;
      if(document.getElementById('number').checked) chars+=num;
      if(document.getElementById('symbol').checked) chars+=sym;
      if(!chars){showToast('至少选择一种字符');return;}
      let html='<div style="display:flex;flex-direction:column;gap:8px">';
      for(let i=0;i<count;i++){
        let pass='';
        for(let j=0;j<len;j++) pass+=chars[Math.floor(Math.random()*chars.length)];
        html+=`<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 16px">
          <code style="flex:1;font-family:var(--font-mono);font-size:15px;word-break:break-all">${pass}</code>
          <button class="btn btn-sm" onclick="copyToClipboard('${pass}')">📋</button>
        </div>`;
      }
      html+='</div>';
      document.getElementById('results').innerHTML=html;
      logToolUsage('password','generate');
    }
  </script>
</body>
</html>
