<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <header>
    <div class="container">
      <a href="../index.html" class="back">← 返回工具箱</a>
      <h1>🔑 密码生成器</h1>
    </div>
  </header>

  <div class="tool-container">
    <div class="tool-box">
      <h3>设置</h3>
      <label>长度: <input type="number" id="len" value="16" min="4" max="64" style="width:80px"></label><br><br>
      <label><input type="checkbox" id="upper" checked> 大写字母 (A-Z)</label><br>
      <label><input type="checkbox" id="lower" checked> 小写字母 (a-z)</label><br>
      <label><input type="checkbox" id="number" checked> 数字 (0-9)</label><br>
      <label><input type="checkbox" id="symbol"> 特殊符号 (!@#$...)</label>
      <div style="margin-top:16px">
        <button class="btn" onclick="generate()">生成密码</button>
        <button class="btn btn-secondary" onclick="copyPwd()">复制</button>
      </div>
    </div>
    <div class="tool-box">
      <h3>结果</h3>
      <div id="output" class="output-box" style="font-size:1.2rem;word-break:break-all"></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function generate() {
      const len = parseInt(document.getElementById('len').value) || 16;
      const useUpper = document.getElementById('upper').checked;
      const useLower = document.getElementById('lower').checked;
      const useNum = document.getElementById('number').checked;
      const useSym = document.getElementById('symbol').checked;
      let chars = '';
      if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (useNum) chars += '0123456789';
      if (useSym) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      if (!chars) { document.getElementById('output').textContent = '❌ 至少选一种字符'; return; }
      let pwd = '';
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      for (let i = 0; i < len; i++) pwd += chars[arr[i] % chars.length];
      document.getElementById('output').textContent = pwd;
      document.getElementById('hint').textContent = '✅ 已生成';
      logTool('password', 'generate');
    }
    function copyPwd() {
      const text = document.getElementById('output').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('hint').textContent = '✅ 已复制';
      });
    }
  </script>
</body>
</html>
