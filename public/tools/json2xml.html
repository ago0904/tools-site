<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON/XML 互转 - DevTools</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⇄</text></svg>">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">JSON / XML 互转</div>
        <div class="topbar-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button><a href="/" class="btn btn-sm">🏠 首页</a></div>
      </header>
      <div class="content-body">
        <div class="tool-layout">
          <div class="panel">
            <div class="panel-header"><span>输入</span><div class="panel-actions"><button class="btn btn-sm" onclick="clearAll()">🗑️</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="input" placeholder="粘贴 JSON 或 XML..."></textarea></div>
          </div>
          <div class="middle-actions">
            <button class="btn btn-primary" onclick="json2xml()" title="JSON → XML">📤</button>
            <button class="btn btn-sm" onclick="xml2json()" title="XML → JSON">📥</button>
          </div>
          <div class="panel">
            <div class="panel-header"><span>输出</span><div class="panel-actions"><button class="btn btn-sm" onclick="copyOutput()">📋</button></div></div>
            <div class="panel-body"><textarea class="code-editor" id="output" placeholder="结果..." readonly></textarea></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    renderToolPage('json2xml','JSON/XML 互转','json');
    function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';}
    function objToXml(o,name='root'){let xml='';if(Array.isArray(o)){o.forEach(i=>{xml+=objToXml(i,name);});}else if(typeof o==='object'&&o!==null){xml+=`<${name}>`;for(const[k,v]of Object.entries(o)){xml+=objToXml(v,k);}xml+=`</${name}>`;}else{xml+=`<${name}>${o}</${name}>`;}return xml;}
    function json2xml(){const v=document.getElementById('input').value.trim();if(!v){showToast('请输入 JSON');return;}try{const o=JSON.parse(v);document.getElementById('output').value='<?xml version="1.0" encoding="UTF-8"?>\n'+objToXml(o);logToolUsage('json2xml','json2xml');}catch(e){document.getElementById('output').value='❌ '+e.message;}}
    function xml2json(){const v=document.getElementById('input').value.trim();if(!v){showToast('请输入 XML');return;}try{const p=new DOMParser();const d=p.parseFromString(v,'text/xml');document.getElementById('output').value=JSON.stringify(xmlToObj(d.documentElement),null,2);logToolUsage('json2xml','xml2json');}catch(e){document.getElementById('output').value='❌ '+e.message;}}
    function xmlToObj(el){if(el.children.length===0)return el.textContent;const o={};for(const c of el.children){const name=c.tagName;if(o[name]){if(!Array.isArray(o[name]))o[name]=[o[name]];o[name].push(xmlToObj(c));}else{o[name]=xmlToObj(c);}}return o;}
    function copyOutput(){const o=document.getElementById('output').value;if(o)copyToClipboard(o);else showToast('无内容');}
  </script>
</body>
</html>
