<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 工具统计</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav>
    <div class="nav-brand">📊 工具箱后台</div>
    <div class="nav-links">
      <a href="#" class="active" data-tab="dashboard">仪表盘</a>
      <a href="#" data-tab="tools">工具统计</a>
      <a href="#" data-tab="pages">页面访问</a>
      <a href="#" data-tab="logs">实时日志</a>
    </div>
    <a href="/" class="nav-back">返回网站 →</a>
  </nav>

  <main>
    <!-- 仪表盘 -->
    <section id="tab-dashboard" class="tab active">
      <div class="cards">
        <div class="card blue">
          <div class="card-value" id="totalVisits">0</div>
          <div class="card-label">总访问量</div>
        </div>
        <div class="card green">
          <div class="card-value" id="uniqueVisitors">0</div>
          <div class="card-label">独立访客</div>
        </div>
        <div class="card purple">
          <div class="card-value" id="totalTools">0</div>
          <div class="card-label">活跃工具</div>
        </div>
        <div class="card orange">
          <div class="card-value" id="todayVisits">0</div>
          <div class="card-label">今日访问</div>
        </div>
      </div>

      <div class="charts-row">
        <div class="chart-box">
          <h3>7日访问趋势</h3>
          <canvas id="trendChart"></canvas>
        </div>
        <div class="chart-box">
          <h3>热门工具 TOP10</h3>
          <canvas id="toolsChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 工具统计 -->
    <section id="tab-tools" class="tab">
      <h2>工具使用情况</h2>
      <table class="data-table">
        <thead>
          <tr><th>工具名</th><th>总使用次数</th><th>独立用户</th><th>最后使用</th></tr>
        </thead>
        <tbody id="toolsTable"></tbody>
      </table>
    </section>

    <!-- 页面访问 -->
    <section id="tab-pages" class="tab">
      <h2>页面访问统计</h2>
      <table class="data-table">
        <thead>
          <tr><th>页面</th><th>总访问</th><th>独立IP</th></tr>
        </thead>
        <tbody id="pagesTable"></tbody>
      </table>
    </section>

    <!-- 实时日志 -->
    <section id="tab-logs" class="tab">
      <h2>实时工具使用日志</h2>
      <table class="data-table">
        <thead>
          <tr><th>时间</th><th>工具</th><th>操作</th><th>IP</th></tr>
        </thead>
        <tbody id="logsTable"></tbody>
      </table>
      <p class="hint" style="margin-top:10px">自动刷新间隔: 10秒</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
