<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - DevTools v2</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .admin-layout{display:flex;min-height:100vh}
    .admin-sidebar{width:240px;background:var(--bg-secondary);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
    .admin-main{margin-left:240px;flex:1}
    .admin-nav{padding:8px 20px;color:var(--text-secondary);text-decoration:none;font-size:13px;display:block;transition:all .15s;border-left:2px solid transparent}
    .admin-nav:hover,.admin-nav.active{background:rgba(88,166,255,.08);color:var(--accent);border-left-color:var(--accent)}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:20px}
    .stat-value{font-size:28px;font-weight:700;margin-top:8px}
    .stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
    th{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
    .log-row:hover{background:var(--bg-tertiary)}
    .chart-container{height:300px}
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:16px">
        <div style="font-size:18px;font-weight:700;color:var(--text-primary)">📊 后台管理</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">DevTools v2</div>
      </div>
      <nav>
        <a href="#dashboard" class="admin-nav active" onclick="showTab('dashboard')">仪表盘</a>
        <a href="#tools" class="admin-nav" onclick="showTab('tools')">工具统计</a>
        <a href="#pages" class="admin-nav" onclick="showTab('pages')">页面访问</a>
        <a href="#logs" class="admin-nav" onclick="showTab('logs')">实时日志</a>
        <div class="divider" style="margin:8px 20px"></div>
        <a href="/" class="admin-nav">🏠 返回首页</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="topbar" style="padding:0 32px">
        <div class="topbar-title">仪表盘</div>
        <div class="topbar-actions">
          <span class="badge" id="lastUpdate">--</span>
          <button class="btn btn-sm" onclick="refreshAll()">🔄 刷新</button>
        </div>
      </header>
      <div class="content-body">
        <!-- Dashboard -->
        <div id="tab-dashboard" class="tab-content">
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-label">总工具使用</div><div class="stat-value" id="totalTool">--</div></div>
            <div class="stat-card"><div class="stat-label">今日工具使用</div><div class="stat-value" id="todayTool">--</div></div>
            <div class="stat-card"><div class="stat-label">总页面访问</div><div class="stat-value" id="totalPage">--</div></div>
            <div class="stat-card"><div class="stat-label">今日页面访问</div><div class="stat-value" id="todayPage">--</div></div>
            <div class="stat-card"><div class="stat-label">独立工具数</div><div class="stat-value" id="uniqueTools">--</div></div>
            <div class="stat-card"><div class="stat-label">独立页面数</div><div class="stat-value" id="uniquePages">--</div></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">工具使用趋势（7天）</span></div>
            <div class="chart-container"><canvas id="toolChart"></canvas></div>
          </div>
        </div>
        <!-- Tools -->
        <div id="tab-tools" class="tab-content" style="display:none">
          <div class="card">
            <div class="card-header"><span class="card-title">工具使用排行</span></div>
            <table id="toolsTable"><thead><tr><th>排名</th><th>工具</th><th>使用次数</th></tr></thead><tbody></tbody></table>
          </div>
          <div class="card" style="margin-top:16px">
            <div class="card-header"><span class="card-title">工具分布</span></div>
            <div class="chart-container"><canvas id="toolsChart"></canvas></div>
          </div>
        </div>
        <!-- Pages -->
        <div id="tab-pages" class="tab-content" style="display:none">
          <div class="card">
            <div class="card-header"><span class="card-title">页面访问排行</span></div>
            <table id="pagesTable"><thead><tr><th>排名</th><th>页面</th><th>访问次数</th></tr></thead><tbody></tbody></table>
          </div>
        </div>
        <!-- Logs -->
        <div id="tab-logs" class="tab-content" style="display:none">
          <div class="card">
            <div class="card-header"><span class="card-title">实时日志</span><span class="badge">每 10 秒自动刷新</span></div>
            <table id="logsTable"><thead><tr><th>时间</th><th>类型</th><th>内容</th><th>动作</th></tr></thead><tbody></tbody></table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/common.js"></script>
  <script>
    let toolChart, toolsChart;
    function showTab(tab){
      document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');
      document.getElementById('tab-'+tab).style.display='block';
      document.querySelectorAll('.admin-nav').forEach(el=>el.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelector('.topbar-title').textContent = {'dashboard':'仪表盘','tools':'工具统计','pages':'页面访问','logs':'实时日志'}[tab];
    }
    async function refreshAll(){await Promise.all([loadDashboard(),loadTools(),loadPages(),loadLogs()]);document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('zh-CN');}
    async function loadDashboard(){
      const [s,d]=await Promise.all([fetch('/api/stats/summary').then(r=>r.json()),fetch('/api/stats/daily?days=7').then(r=>r.json())]);
      document.getElementById('totalTool').textContent=s.total_tool_usage;
      document.getElementById('todayTool').textContent=s.today_tool_usage;
      document.getElementById('totalPage').textContent=s.total_page_views;
      document.getElementById('todayPage').textContent=s.today_page_views;
      document.getElementById('uniqueTools').textContent=s.unique_tools;
      document.getElementById('uniquePages').textContent=s.unique_pages;
      const labels=d.map(x=>x.date);const data=d.map(x=>x.tool_count);
      if(toolChart)toolChart.destroy();
      toolChart=new Chart(document.getElementById('toolChart'),{type:'line',data:{labels,datasets:[{label:'工具使用',data,borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,.1)',fill:true,tension:.4,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'var(--border)'}},x:{grid:{color:'var(--border)'}}}}});
    }
    async function loadTools(){
      const data=await fetch('/api/stats/tools').then(r=>r.json());
      const tbody=document.querySelector('#toolsTable tbody');
      tbody.innerHTML=data.map((t,i)=>`<tr><td>${i+1}</td><td>${t.tool}</td><td>${t.count}</td></tr>`).join('');
      if(toolsChart)toolsChart.destroy();
      const top=data.slice(0,8);
      toolsChart=new Chart(document.getElementById('toolsChart'),{type:'bar',data:{labels:top.map(t=>t.tool),datasets:[{label:'使用次数',data:top.map(t=>t.count),backgroundColor:'#58a6ff',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'var(--border)'}},x:{grid:{display:false}}}}});
    }
    async function loadPages(){
      const data=await fetch('/api/stats/pages').then(r=>r.json());
      document.querySelector('#pagesTable tbody').innerHTML=data.map((p,i)=>`<tr><td>${i+1}</td><td>${p.page}</td><td>${p.count}</td></tr>`).join('');
    }
    async function loadLogs(){
      const data=await fetch('/api/stats/recent?limit=50').then(r=>r.json());
      document.querySelector('#logsTable tbody').innerHTML=data.map(l=>`<tr class="log-row"><td>${new Date(l.timestamp+'Z').toLocaleString('zh-CN')}</td><td><span class="badge" style="background:${l.type==='tool'?'rgba(88,166,255,.15)':'rgba(63,185,80,.15)'};color:${l.type==='tool'?'#58a6ff':'#3fb950'}">${l.type}</span></td><td>${l.content}</td><td>${l.action||'-'}</td></tr>`).join('');
    }
    refreshAll();
    setInterval(loadLogs,10000);
  </script>
</body>
</html>
